<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <title>Zapper Open</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
</head>
<body class="page-main">
  <header>
    <div class="header-top">
      <h1>Zapper</h1>
      <span id="status">&#9679;</span>
      <a id="header-terminal" class="header-icon-btn" href="/terminal.html" title="open the terminal" aria-label="terminal" style="margin-left:auto">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M7 9l3 3-3 3"/>
          <path d="M12.5 15h4.5"/>
        </svg>
      </a>
      <button id="hamburger-toggle" type="button" aria-expanded="false" aria-controls="hamburger-panel" title="menu">Menu</button>
    </div>
    <div id="hamburger-panel" hidden>
      <label class="menu-row">
        <span>node</span>
        <select id="session-picker">
          <option value="__all__">all (timeline)</option>
        </select>
      </label>
      <div class="menu-row">
        <input id="new-tmux-name" type="text" placeholder="tmux session name" value="main" pattern="[A-Za-z0-9_.\-]+" maxlength="40">
        <button id="open-terminal" type="button" title="open this tmux session in a full-screen terminal">Terminal</button>
      </div>
      <a class="menu-link" href="/">main</a>
      <a class="menu-link" id="menu-terminal" href="/terminal.html">terminal</a>
    </div>
  </header>
  <main>
    <div id="cmd-bar">
      <span id="cmd-target" class="cmd-target">select a node</span>
      <input id="cmd-text" type="text" placeholder="comment to the selected node's next turn (Enter)" autocomplete="off" disabled>
      <button id="cmd-send" type="button" title="send" aria-label="send" disabled>
        <svg class="cmd-send-svg" viewBox="0 0 60 52" aria-hidden="true">
          <defs>
            <linearGradient id="cmdSendGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#3a2a0a"/>
              <stop offset="100%" stop-color="#1a1408"/>
            </linearGradient>
          </defs>
          <path d="M 6 2 L 54 2 Q 58 2 55.5 7 L 32 46 Q 30 50 28 46 L 4.5 7 Q 2 2 6 2 Z"
                fill="url(#cmdSendGrad)"
                stroke="rgba(255,179,90,0.6)" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <section id="main-view-section">
      <div id="main-view-container"></div>
    </section>
    <section id="side-terminal-section" data-state="empty">
      <div id="side-terminal-placeholder">click a node to open its terminal here</div>
      <div id="side-terminal-mount"></div>
    </section>
  </main>
  <script src="/term.js"></script>
  <script type="module" src="/main-view.js"></script>
  <script type="module" src="/main.js"></script>
</body></html>
