<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zapper Open</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
</head>
<body>
  <header>
    <span class="brand">Zapper Open</span>
    <span id="status" class="dot" title="websocket"></span>
    <select id="picker" title="session filter">
      <option value="">All sessions (timeline)</option>
    </select>
    <input id="label" type="text" placeholder="label this session" disabled />
    <button id="saveLabel" disabled>save</button>
    <span class="spacer"></span>
    <input id="tmuxname" type="text" value="main" title="tmux session for the terminal" />
    <button id="openTerm" title="open the terminal full-screen">Terminal &#8599;</button>
  </header>

  <div class="cmdbar">
    <input id="comment" type="text" placeholder="select a session, then send a comment to its next turn" disabled />
    <button id="send" disabled>send</button>
  </div>

  <main>
    <section id="sketch"></section>
    <aside id="termpane">
      <div class="termhead">
        <span>terminal</span>
        <span id="termtarget" class="muted">main</span>
        <button id="attachTerm" title="attach / reconnect">attach</button>
      </div>
      <div id="term"></div>
    </aside>
  </main>

  <div id="modal" class="modal hidden">
    <div class="card">
      <div class="who" id="modalWho"></div>
      <div class="tool" id="modalTool"></div>
      <pre class="detail" id="modalDetail"></pre>
      <div class="actions">
        <button id="allow" class="allow">allow</button>
        <button id="deny" class="deny">deny</button>
      </div>
    </div>
  </div>

  <script src="term.js"></script>
  <script src="app.js"></script>
</body>
</html>
